name: Playwright Tests
on: [push, pull_request]

jobs:
  quality_gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Install dependencies
        run: npm ci
      - name: Lint & Type Check
        run: |
          npm run lint
          npx tsc --noEmit

